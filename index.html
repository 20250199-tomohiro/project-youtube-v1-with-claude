<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #0f1115; color: #e8eaed;
  }
  main { width: 100%; max-width: 640px; padding: 24px; text-align: center; }
  h1 { font-size: 1.6rem; margin-bottom: 24px; font-weight: 600; }
  .row { display: flex; gap: 8px; }
  input[type=url] {
    flex: 1; padding: 14px 16px; font-size: 1rem; border-radius: 10px;
    border: 1px solid #3a3f4b; background: #1a1d24; color: inherit; outline: none;
  }
  input[type=url]:focus { border-color: #6ea8fe; }
  button {
    padding: 14px 20px; font-size: 1rem; border: 0; border-radius: 10px;
    background: #6ea8fe; color: #0b1220; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  button.secondary { background: #2a2f3a; color: #e8eaed; }
  #result { margin-top: 24px; display: none; text-align: left; background: #1a1d24;
            border-radius: 12px; padding: 16px; }
  #result img { width: 100%; border-radius: 8px; margin-bottom: 12px; }
  #title { font-weight: 600; margin-bottom: 4px; }
  #meta { color: #9aa0a6; font-size: .9rem; margin-bottom: 14px; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; }
  #msg { margin-top: 16px; min-height: 1.4em; color: #f28b82; font-size: .9rem; word-break: break-all; }
  #msg.ok { color: #81c995; }
</style>
</head>
<body>
<main>
  <h1>動画ダウンローダー</h1>
  <form id="form" class="row">
    <input id="url" type="url" placeholder="動画のURLを貼り付け" required autofocus>
    <button id="go" type="submit">取得</button>
  </form>

  <div id="result">
    <img id="thumb" alt="">
    <div id="title"></div>
    <div id="meta"></div>
    <div class="actions">
      <button id="dlVideo">動画 (MP4)</button>
      <button id="dlAudio" class="secondary">音声 (MP3)</button>
    </div>
  </div>
  <div id="msg"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let currentUrl = "";

function fmt(sec) {
  if (!sec) return "";
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
function say(text, ok = false) { $("msg").textContent = text; $("msg").className = ok ? "ok" : ""; }

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  currentUrl = $("url").value.trim();
  $("result").style.display = "none";
  say("取得中…", true);
  $("go").disabled = true;
  try {
    const r = await fetch("/api/info", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: currentUrl }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "エラー");
    $("thumb").src = d.thumbnail || "";
    $("thumb").style.display = d.thumbnail ? "block" : "none";
    $("title").textContent = d.title || "";
    $("meta").textContent = [d.uploader, fmt(d.duration)].filter(Boolean).join(" ・ ");
    $("result").style.display = "block";
    say("");
  } catch (err) {
    say(err.message);
  } finally {
    $("go").disabled = false;
  }
});

async function download(kind) {
  const btns = [$("dlVideo"), $("dlAudio")];
  btns.forEach(b => b.disabled = true);
  say("ダウンロード準備中…(長い動画は時間がかかります)", true);
  try {
    const r = await fetch("/api/download?" + new URLSearchParams({ url: currentUrl, kind }));
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || "ダウンロードに失敗しました");
    }
    const cd = r.headers.get("Content-Disposition") || "";
    let name = "download";
    const m = cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="?([^";]+)"?/i);
    if (m) name = decodeURIComponent(m[1]);
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    say("完了しました", true);
  } catch (err) {
    say(err.message);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}
$("dlVideo").onclick = () => download("video");
$("dlAudio").onclick = () => download("audio");
</script>
</body>
</html>
